name: Build

# Build gate: builds the starter on every PR. This repo is a
# template people fork, so a broken build here is shipped to every one of them.
#
# npm, not bun: package-lock.json is the only lockfile committed here, and it's what
# `npm run fetch-content` / the deploy Action assume.

# Pull requests only, deliberately. This file is copied into every project generated from
# this template, where `bcms-rebuild.yml` ALREADY builds (and deploys) on push — gating push
# here would build every change twice and bill it to the user's Actions minutes for no extra
# signal. A PR is where a broken build should be caught, and nothing else covers that.
on:
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nuxt 4 needs Node ^22.22.3 / ^24.15.0 / >=26. No `cache: npm`: it refuses to run
      # without a lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # With a lockfile: --frozen-lockfile equivalent, installs exactly what it pins and fails
      # if it has drifted from package.json. Without one: a fresh resolve of the ranges.
      - name: Install dependencies
        run: npm ci

      # `bcms-content.json` is the deploy Action's build snapshot and is gitignored, so
      # CI never has one — and a static build resolves ALL content from it. This writes a
      # throwaway stand-in so the build has something to render. It is NOT the template's
      # content; it only needs to exist and carry one entry per collection.
      #
      # This starter tolerates a missing snapshot (no pages → title + "not published yet"),
      # but with no entries the dynamic routes prerender NOTHING — so the gate would pass
      # while proving nothing about /blog/[slug]. Every starter repo seeds the same stand-in
      # so their gates stay identical and none can regress into needing real credentials.
      # No NUXT_PUBLIC_BCMS_* here, so the build makes no network call.
      - name: Seed a stand-in content snapshot
        run: |
          cat > bcms-content.json <<'JSON'
          {
            "collections": {
              "site": [{ "slug": "site", "data": { "brandName": "CI" } }],
              "blog-post": [{ "slug": "ci-post", "data": { "title": "CI post" } }],
              "case-study": [{ "slug": "ci-case", "data": { "title": "CI case" } }]
            },
            "pages": [],
            "forms": []
          }
          JSON

      - name: Build
        run: npm run build
